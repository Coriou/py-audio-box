name: Unit contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build CPU test image and run contracts without network
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/unit-diagnostics"
          mkdir -p "$diagnostics"
          step_started=$SECONDS
          container_id=''
          follower_pid=''
          # Drain continuously; retain only the last 256 KiB per stream. No line buffering.
          cat >"$diagnostics/retain.py" <<'PYTHON'
          import os, selectors, signal, subprocess, sys, time
          from pathlib import Path
          root = Path(sys.argv[1])
          child = subprocess.Popen(sys.argv[3:], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          prefix = sys.argv[2]
          stopping = False
          def stop(*_):
              global stopping
              stopping = True
          signal.signal(signal.SIGTERM, stop)
          signal.signal(signal.SIGINT, stop)
          sel = selectors.DefaultSelector()
          tails = {}
          for name, stream in [('stdout', child.stdout), ('stderr', child.stderr)]:
              sel.register(stream, selectors.EVENT_READ, name)
              tails[name] = b''
          last = 0.0
          try:
              while sel.get_map() and not stopping:
                  for key, _ in sel.select(0.2):
                      data = os.read(key.fd, 65536)
                      if not data:
                          sel.unregister(key.fileobj)
                          continue
                      name = key.data
                      tails[name] = (tails[name] + data)[-262144:]
                      (root / (prefix + '.' + name)).write_bytes(tails[name])
                      # Prefix and ASCII filtering prevent runner command/control injection.
                      lines = tails[name].splitlines()
                      latest = next((v for v in reversed(lines) if b'::' in v), b'')
                      if not latest:
                          continue
                      safe = ''.join(chr(v) if 32 <= v < 127 else '?' for v in latest[-512:])
                      (root / 'latest-progress.txt').write_text('test progress: ' + safe + '\n')
                      if time.monotonic() - last >= 15:
                          print('test progress: ' + safe, flush=True)
                          last = time.monotonic()
          finally:
              if child.poll() is None:
                  child.terminate()
                  try:
                      child.wait(timeout=2)
                  except subprocess.TimeoutExpired:
                      child.kill()
              child.wait()
              (root / (prefix + '-follower-reaped.txt')).write_text(str(child.returncode) + '\n')
          sys.exit(143 if stopping else child.returncode if child.returncode >= 0 else 125)
          PYTHON
          finish() {
            result=$?
            trap - EXIT INT TERM
            set +e
            if [[ -n "$container_id" ]]; then
              # Cancellation: stop only our container, then collect terminal state.
              running=$(timeout 10s docker inspect --format '{{.State.Running}}' "$container_id" 2>>"$diagnostics/diagnostics.stderr")
              if [[ "$running" == true ]]; then
                timeout 25s docker stop --time 10 "$container_id" >>"$diagnostics/cleanup.log" 2>&1
                running=$(timeout 10s docker inspect --format '{{.State.Running}}' "$container_id" 2>>"$diagnostics/diagnostics.stderr")
                if [[ "$running" == true ]]; then
                  timeout 10s docker kill "$container_id" >>"$diagnostics/cleanup.log" 2>&1
                fi
                timeout 15s docker wait "$container_id" >>"$diagnostics/cleanup.log" 2>&1
              fi
              timeout 10s docker inspect --format '{"Status":{{json .State.Status}},"Running":{{json .State.Running}},"OOMKilled":{{json .State.OOMKilled}},"ExitCode":{{json .State.ExitCode}},"Error":{{json .State.Error}}}' "$container_id" >"$diagnostics/state.json" 2>>"$diagnostics/diagnostics.stderr"
              cat "$diagnostics/state.json"
              running=$(timeout 10s docker inspect --format '{{.State.Running}}' "$container_id" 2>>"$diagnostics/diagnostics.stderr")
            fi
            if [[ -n "$follower_pid" ]]; then
              # Terminal container state does not imply that log replay reached EOF.
              # Spend at most five seconds of cleanup/upload reserve on natural drain.
              drain_status=not-terminal
              if [[ "${running:-}" == false ]]; then
                drain_status=eof
                drain_deadline=$((SECONDS + 5))
                while kill -0 "$follower_pid" 2>/dev/null; do
                  if (( SECONDS >= drain_deadline )); then
                    drain_status=expired-truncated
                    break
                  fi
                  sleep 0.1
                done
              fi
              if kill -0 "$follower_pid" 2>/dev/null; then
                kill -TERM "$follower_pid" 2>/dev/null
                # retain.py gives its owned logs child two seconds before KILL/reap.
                follower_deadline=$((SECONDS + 4))
                while kill -0 "$follower_pid" 2>/dev/null && (( SECONDS < follower_deadline )); do
                  sleep 0.1
                done
                if kill -0 "$follower_pid" 2>/dev/null; then
                  drain_status="$drain_status-helper-killed"
                  kill -KILL "$follower_pid" 2>/dev/null
                fi
              fi
              wait "$follower_pid"
              follower_result=$?
              printf 'drain=%s follower_exit=%s\n' "$drain_status" "$follower_result" >"$diagnostics/log-drain.txt"
            fi
            if [[ -n "$container_id" && "${running:-}" == false ]]; then
              timeout 10s docker rm "$container_id" >>"$diagnostics/cleanup.log" 2>&1
            fi
            printf '%s\n' "$result" >"$diagnostics/step-exit-code.txt"
            exit "$result"
          }
          trap finish EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          image="${PAB_TEST_IMAGE:-py-audio-box-unit-tests}"
          python3 "$diagnostics/retain.py" "$diagnostics" build timeout 900s docker build -f Dockerfile.tests -t "$image" .
          # Keep the runner's unit scope and all security/resource limits unchanged.
          selection=(tests -m 'not integration and not redis_integration and not manual_b_probe'
            --ignore=tests/local --ignore=tests/remote
            --ignore=tests/release/test_dispatcher.py
            --ignore=tests/release/test_packaged_lifecycle.py
            --ignore=tests/release/test_admission.py
            -p no:cacheprovider -x -vv --tb=short)
          name="pab-unit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}-${RANDOM}"
          container_id=$(docker create --name "$name" --network none --cpus 2 --memory 1g --memory-swap 1g \
            --log-driver local --log-opt max-size=1m --log-opt max-file=2 \
            --pids-limit 128 --read-only --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            "$image" python -u -m pytest "${selection[@]}" 2>"$diagnostics/create.stderr")
          docker start "$container_id" >"$diagnostics/start.stdout" 2>"$diagnostics/start.stderr"
          # logs replays output already emitted between start and follower attachment.
          python3 "$diagnostics/retain.py" "$diagnostics" container docker logs --follow "$container_id" &
          follower_pid=$!
          # Twelve minutes for tests, and at most 17 minutes since step entry.
          # Reserve three minutes inside the unchanged job deadline for cleanup/upload.
          test_deadline=$((SECONDS + 720))
          step_deadline=$((step_started + 1020))
          while :; do
            running=$(timeout 10s docker inspect --format '{{.State.Running}}' "$container_id" 2>>"$diagnostics/diagnostics.stderr") || exit 125
            [[ "$running" == true || "$running" == false ]] || exit 125
            [[ "$running" == true ]] || break
            if (( SECONDS >= test_deadline || SECONDS >= step_deadline )); then
              printf 'test watchdog expired; exit 124\n' >"$diagnostics/timeout.txt"
              exit 124
            fi
            kill -0 "$follower_pid" 2>/dev/null || exit 125
            sleep 2
          done
          timeout 15s docker wait "$container_id" >"$diagnostics/container-exit-code.txt" 2>"$diagnostics/wait.stderr"
          result=$(cat "$diagnostics/container-exit-code.txt")
          [[ "$result" =~ ^[0-9]+$ && "$result" -le 255 ]] || exit 125
          exit "$result"
      - name: Upload unit diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit-diagnostics/
          if-no-files-found: warn
          retention-days: 7
