name: Apple Kokoro CPU prerequisites
on:
  push:
    paths: &paths
      - '.github/workflows/apple-kokoro.yml'
      - 'lib/tts_backends/kokoro*.py'
      - 'lib/tts_backends/espeak_memfd.py'
      - 'requirements/kokoro.*'
      - 'requirements/client.lock'
      - 'native-cpu-dist-manifest.json'
      - 'scripts/native-kokoro.py'
      - 'scripts/ci-native-kokoro.py'
      - 'scripts/ci-native-kokoro-speech.py'
      - 'scripts/ci-native-kokoro-installed.py'
      - 'tests/test_ci_native_kokoro_installed.py'
      - 'requirements/tts/kokoro-en-macos.expected.json'
      - 'tests/test_ci_native_kokoro_speech.py'
      - 'scripts/ci-apple-speech.py'
      - 'scripts/ci_process_rss.py'
      - 'tests/test_native_kokoro.py'
      - 'worker/native_cpu*.py'
      - 'worker/native_family.py'
      - 'worker/native_memory.py'
      - 'worker/native_supervisor.py'
      - 'worker/native_protocol.py'
      - 'worker/runtime_protocol.py'
      - 'worker/engines/native_kokoro.py'
      - 'service/**'
      - 'contracts/**'
      - 'tests/worker/test_native_cpu*.py'
      - 'tests/worker/test_native_memory.py'
      - 'tests/worker/test_native_kokoro_execution.py'
      - 'tests/service/test_native_cpu*.py'
      - 'tests/release/test_native_cpu*.py'
      - 'native-dist-manifest.json'
      - 'docs/agent-interface/NATIVE-KOKORO.md'
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      en_backend:
        description: One cold EN Kokoro backend test (353.75 MB, no installed qualification)
        type: boolean
        default: false
      installed_journey:
        description: One fresh installed EN journey (353.75 MB, four jobs maximum, no ordinary readiness promotion)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: apple-kokoro-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prerequisites:
    runs-on: macos-15
    timeout-minutes: 8
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Reject multiple model experiments
        if: github.event_name == 'workflow_dispatch' && inputs.en_backend && inputs.installed_journey
        run: exit 1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: arm64
      - name: Fresh binary-only existing pinned Kokoro and service closure (no models)
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --index-url https://pypi.org/simple --report kokoro-install.json
          -r requirements/kokoro.lock -r requirements/client.lock -r service/requirements.lock
      - run: python -m pip check
      - name: Guarded CPU phonemization, actual control imports and TLS prerequisites
        run: python scripts/native-kokoro.py preflight --output kokoro-preflight
      - name: Focused errors and native source archive closure
        run: >-
          python -B -m unittest tests.test_native_kokoro
          tests.release.test_native_package.NativePackageTests.test_archive_exact_members_secrets_excluded_extracted_help
          tests.test_native_qwen_artifact tests.test_ci_native_kokoro_speech
      - name: Separate CPU protocol, ownership, deadlines and catalogue source contracts (no weights)
        run: >-
          python -B -m unittest tests.worker.test_native_kokoro_execution
          tests.worker.test_native_cpu_availability tests.worker.test_native_cpu_resources
          tests.worker.test_native_cpu_child tests.worker.test_native_cpu_supervisor
          tests.worker.test_native_memory tests.service.test_native_cpu_context
          tests.worker.test_native_cpu_qualification tests.service.test_native_cpu_configuration
          tests.service.test_native_cpu_bootstrap tests.service.test_native_cpu_download
          tests.service.test_native_cpu_public_source tests.service.test_native_cpu_tls
          tests.service.test_native_cpu_install
          tests.service.test_native_cpu_recovery
          tests.test_ci_native_kokoro_installed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: apple-kokoro-prerequisites
          path: |
            kokoro-install.json
            kokoro-preflight/report.json
            kokoro-preflight/owner.json
            kokoro-preflight/child.log
          retention-days: 7
          if-no-files-found: error

  en-backend:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.en_backend &&
      !inputs.installed_journey &&
      (github.ref == 'refs/heads/feat/apple-silicon-native' || github.ref == 'refs/heads/main')
    needs: prerequisites
    runs-on: macos-15
    timeout-minutes: 12
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: arm64
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --index-url https://pypi.org/simple -r requirements/kokoro.lock
      - run: python -m pip check
      - name: Real guarded prerequisites in this environment before acquisition
        run: python scripts/ci-native-kokoro.py --output kokoro-preflight
      - name: One explicit cold EN backend test (no retry)
        run: python scripts/ci-native-kokoro-speech.py --run-en-backend --output kokoro-speech
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: apple-kokoro-en-backend
          path: |
            kokoro-preflight/report.json
            kokoro-preflight/owner.json
            kokoro-preflight/child.log
            kokoro-speech/report.json
            kokoro-speech/English.json
            kokoro-speech/English.wav
            kokoro-speech/progress.json
            kokoro-speech/acquire.log
            kokoro-speech/infer.log
          retention-days: 7
          if-no-files-found: error

  installed-journey:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.installed_journey &&
      !inputs.en_backend &&
      (github.ref == 'refs/heads/feat/apple-silicon-native' || github.ref == 'refs/heads/main')
    needs: prerequisites
    runs-on: macos-15
    timeout-minutes: 12
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: arm64
      - name: One explicit fresh installed product journey (no retry)
        run: python scripts/ci-native-kokoro-installed.py --run-installed-journey --output kokoro-installed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: apple-kokoro-installed-journey
          path: |
            kokoro-installed/report.json
            kokoro-installed/safe-logs/*.log
            kokoro-installed/English.wav
            kokoro-installed/English-restart.wav
            kokoro-installed/LISTEN.html
          retention-days: 7
          if-no-files-found: error
