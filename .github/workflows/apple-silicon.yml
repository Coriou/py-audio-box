name: Apple Silicon dependency contracts
on:
  push:
    paths: &paths
      - '.github/workflows/apple-silicon.yml'
      - 'scripts/ci-apple-silicon.py'
      - 'scripts/ci-apple-speech.py'
      - 'scripts/ci-native-import.py'
      - 'scripts/build-native-qwen-wheel.py'
      - 'requirements/wheels/**'
      - 'requirements/upstream/**'
      - 'tests/test_native_qwen_artifact.py'
      - 'docs/agent-interface/NATIVE-DEPENDENCY.md'
      - 'requirements/tts/qwen-0.6b-customvoice-macos.expected.json'
      - 'requirements/qwen-macos-arm64.*'
      - 'clients/**'
      - 'contracts/**'
      - 'service/**'
      - 'requirements/client.lock'
      - 'tests/clients/test_voice_clients.py'
      - 'tests/service/**'
      - 'docs/agent-interface/NATIVE-PACKAGE.md'
      - 'lib/**'
      - 'worker/**'
      - 'tests/worker/test_native_protocol.py'
      - 'tests/worker/test_native_qwen.py'
      - 'tests/worker/test_engine_qwen.py'
      - 'tests/contracts/test_legacy_controls.py'
      - 'tests/test_ci_apple_silicon.py'
      - 'tests/test_ci_apple_speech.py'
      - 'docs/agent-interface/APPLE-CI.md'
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      mps_probe:
        description: Run the tensor-only MPS probe (does not qualify synthesis)
        type: boolean
        default: false
      qwen_speech:
        description: Cold public Qwen native inference prerequisite (not installed qualification)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: apple-silicon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-speech:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/feat/apple-silicon-native' &&
       contains(github.event.head_commit.message, '[apple-speech]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.qwen_speech &&
       (github.ref == 'refs/heads/feat/apple-silicon-native' || github.ref == 'refs/heads/main'))
    needs: [dependencies, clients]
    runs-on: macos-15
    timeout-minutes: 12
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: arm64
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --index-url https://pypi.org/simple -r requirements/qwen-macos-arm64.lock
      - run: python -m pip check
      - name: Fresh guarded import in the actual speech environment before any download
        run: python scripts/ci-native-import.py --output apple-speech-import
      - name: One cold native EN then FR inference attempt (no retry)
        run: python scripts/ci-apple-speech.py --output apple-speech
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: apple-native-speech
          path: |
            apple-speech/report.json
            apple-speech/English.json
            apple-speech/French.json
            apple-speech/English-progress.json
            apple-speech/French-progress.json
            apple-speech/English.wav
            apple-speech/French.wav
            apple-speech/English.log
            apple-speech/French.log
            apple-speech-import/report.json
            apple-speech-import/owner.json
            apple-speech-import/child.log
          retention-days: 7
          if-no-files-found: error
  dependencies:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: arm64
      - name: Install exact native wheel closure
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --index-url https://pypi.org/simple -r requirements/qwen-macos-arm64.lock
      - run: python -m pip check
      - name: Native real imports and CPU operation (no weights)
        run: python scripts/ci-apple-silicon.py deps-check --report apple-ci/dependencies.json
      - name: Fresh real locked native bootstrap under permanent guard (no weights)
        run: python scripts/ci-native-import.py --output apple-ci/native-import
      - name: Real bounded MPS operation with CPU fallback disabled
        run: python scripts/ci-apple-silicon.py mps-probe --report apple-ci/mps-probe.json
      - name: Explicit Darwin-safe source contracts (inert protocol and CI harness)
        run: >-
          python -m unittest tests.test_ci_apple_silicon tests.test_ci_apple_speech
          tests.worker.test_native_protocol tests.worker.test_native_qwen
          tests.service.test_qwen_provisioning tests.test_native_qwen_artifact -v
      - name: Native archive and selected artifact closure (no runtime)
        run: >-
          python -m unittest
          tests.test_source_distribution tests.release.test_spoken_text_package
          tests.test_docs_onboarding.DocsOnboarding.test_relative_links_and_anchors_resolve
          tests.test_docs_onboarding.DocsOnboarding.test_archive_user_documentation_closure
          tests.release.test_native_package.NativePackageTests.test_archive_exact_members_secrets_excluded_extracted_help
          tests.release.test_native_package.NativePackageTests.test_archive_deterministic_bytes
          tests.release.test_native_package.NativePackageTests.test_selected_wheel_active_dependencies_refuse -v
      - name: Legacy loader and explicit device forwarding remain unchanged
        run: >-
          python -m unittest tests.contracts.test_legacy_controls
          tests.worker.test_engine_qwen.QwenTests.test_local_loader_exact_device_and_no_auto_fallback -v
      - name: Print dependency evidence (missing report fails visibly)
        if: always()
        run: cat apple-ci/dependencies.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: apple-dependencies
          path: |
            apple-ci/dependencies.json
            apple-ci/mps-probe.json
            apple-ci/native-import/report.json
            apple-ci/native-import/owner.json
            apple-ci/native-import/child.log
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
  clients:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      APPLE_CLIENT_SMOKE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: arm64
      - name: Fresh hash-locked CLI and service installs, real fixture and stdio
        run: python scripts/ci-apple-silicon.py clients-check --report apple-ci/clients.json
      - name: Print client evidence (missing report fails visibly)
        if: always()
        run: cat apple-ci/clients.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: apple-clients
          path: apple-ci/clients.json
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
  mps-probe:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mps_probe &&
      (github.ref == 'refs/heads/feat/apple-silicon-native' || github.ref == 'refs/heads/main')
    needs: dependencies
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
      OMP_NUM_THREADS: '2'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: arm64
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --index-url https://pypi.org/simple -r requirements/qwen-macos-arm64.lock
      - run: python -m pip check
      - name: Isolated 30 second MPS tensor probe
        run: python scripts/ci-apple-silicon.py mps-probe --report apple-ci/mps-probe.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: apple-mps-probe
          path: apple-ci/mps-probe.json
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
