name: Apple Silicon dependency contracts
on:
  push:
    paths: &paths
      - '.github/workflows/apple-silicon.yml'
      - 'scripts/ci-apple-silicon.py'
      - 'requirements/qwen-macos-arm64.*'
      - 'lib/**'
      - 'worker/**'
      - 'tests/worker/test_native_protocol.py'
      - 'tests/test_ci_apple_silicon.py'
      - 'docs/agent-interface/APPLE-CI.md'
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      mps_probe:
        description: Run the tensor-only MPS probe (does not qualify synthesis)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: apple-silicon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: arm64
      - name: Install exact native wheel closure
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --index-url https://pypi.org/simple -r requirements/qwen-macos-arm64.lock
      - run: python -m pip check
      - name: Native real imports and CPU operation (no weights)
        run: python scripts/ci-apple-silicon.py deps-check --report apple-ci/dependencies.json
      - name: Explicit Darwin-safe source contracts (inert protocol and CI harness)
        run: python -m unittest tests.test_ci_apple_silicon tests.worker.test_native_protocol -v
  mps-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.mps_probe
    needs: dependencies
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
      OMP_NUM_THREADS: '2'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: arm64
      - run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --index-url https://pypi.org/simple -r requirements/qwen-macos-arm64.lock
      - run: python -m pip check
      - name: Isolated 30 second MPS tensor probe
        run: python scripts/ci-apple-silicon.py mps-probe --report apple-ci/mps-probe.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: apple-mps-probe
          path: apple-ci/mps-probe.json
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false
