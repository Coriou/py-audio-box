# Disposable W2 synthetic harness, no deployed runtime operator.
services:
  init:
    image: ${W2_CONTROL_IMAGE:?required}
    user: '0:0'
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    command: [python, -c, "import os; [(os.chown(p,10001,10001),os.chmod(p,0o770)) for p in ('/ipc','/staging','/control')]"]
    volumes:
      - ipc:/ipc
      - staging:/staging
      - control:/control
  control:
    command: [python, -m, tests.release.test_worker_lifecycle_boundary]
    environment:
      W2_ACTION: ${W2_ACTION:-prepare}
      W2_IGNORE_TERM: ${W2_IGNORE_TERM:-0}
    image: ${W2_CONTROL_IMAGE:?required}
    user: '10001:10001'
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 384m
    cpus: 1
    volumes:
      - ipc:/ipc
      - staging:/staging
      - control:/control
    depends_on:
      init:
        condition: service_completed_successfully
  worker:
    restart: "no"
    image: ${W2_WORKER_IMAGE:?required}
    user: '10002:10001'
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    cpus: 1
    volumes:
      - ipc:/ipc
      - staging:/staging
    depends_on:
      init:
        condition: service_completed_successfully
volumes:
  ipc:
  staging:
  control:
